name: Build Ultron APK

on:
  workflow_dispatch:   # lets you trigger it manually from the Actions tab
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ultron-repo
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # Big model/voice files live as attachments on a GitHub Release
      # (tag: assets-v1) instead of in the repo, so we fetch them here.
      - name: Download sherpa-onnx AAR
        run: |
          mkdir -p app/libs
          aar_name=$(curl -s "https://huggingface.co/api/models/csukuangfj/sherpa-onnx-libs/tree/main/android/aar" \
            | jq -r '.[].path' | grep '\.aar$' | grep -v static-link | sort -V | tail -n1)
          echo "Using $aar_name"
          curl -L -o app/libs/sherpa-onnx.aar \
            "https://huggingface.co/csukuangfj/sherpa-onnx-libs/resolve/main/$aar_name"

      - name: Download Vosk model
        run: |
          mkdir -p app/src/main/assets/model-en-us
          curl -L -o /tmp/vosk.zip \
            "https://github.com/${{ github.repository }}/releases/download/assets-v1/vosk-model-small-en-us-0.15.zip"
          unzip -o /tmp/vosk.zip -d /tmp/vosk-unzipped
          inner=$(find /tmp/vosk-unzipped -mindepth 1 -maxdepth 1 -type d | head -n1)
          cp -r "$inner"/* app/src/main/assets/model-en-us/

      - name: Download Piper voice
        run: |
          mkdir -p app/src/main/assets/tts
          curl -L -o app/src/main/assets/tts/en_US-reza_ibrahim-medium.onnx \
            "https://github.com/${{ github.repository }}/releases/download/assets-v1/en_US-reza_ibrahim-medium.onnx"
          curl -L -o app/src/main/assets/tts/en_US-reza_ibrahim-medium.onnx.json \
            "https://github.com/${{ github.repository }}/releases/download/assets-v1/en_US-reza_ibrahim-medium.onnx.json"

      - name: Build debug APK
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ultron-debug-apk
          path: ultron-repo/app/build/outputs/apk/debug/app-debug.apk
