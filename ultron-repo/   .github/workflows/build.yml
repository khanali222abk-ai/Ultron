name: Build Ultron APK

on:
  workflow_dispatch:   # lets you trigger it manually from the Actions tab
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project source
        run: |
          unzip -o project-source.zip -d /tmp/src
          cp -r /tmp/src/. .

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # Big model/voice files live as attachments on a GitHub Release
      # (tag: assets-v1) instead of in the repo, so we fetch them here.
      - name: Download Vosk model
        run: |
          mkdir -p app/src/main/assets/model-en-us
          curl -L -o /tmp/vosk.zip \
            "https://github.com/${{ github.repository }}/releases/download/assets-v1/vosk-model-small-en-us-0_15.zip"
          unzip -o /tmp/vosk.zip -d /tmp/vosk-unzipped
          inner=$(find /tmp/vosk-unzipped -mindepth 1 -maxdepth 1 -type d | head -n1)
          cp -r "$inner"/* app/src/main/assets/model-en-us/

      - name: Download Piper voice
        run: |
          mkdir -p app/src/main/assets/tts
          curl -L -o app/src/main/assets/tts/en_US-reza_ibrahim-medium.onnx \
            "https://github.com/${{ github.repository }}/releases/download/assets-v1/en_US-reza_ibrahim-medium.onnx"
          curl -L -o app/src/main/assets/tts/en_US-reza_ibrahim-medium.onnx.json \
            "https://github.com/${{ github.repository }}/releases/download/assets-v1/en_US-reza_ibrahim-medium_onnx.json"

      - name: Build debug APK
        env:
          PICOVOICE_ACCESS_KEY: ${{ secrets.PICOVOICE_ACCESS_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ultron-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
